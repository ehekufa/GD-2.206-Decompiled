name: Build DS Game (Android APK)

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-android:
    name: Build Android APK (Android 8-15 arm64+arm32+x86_64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check package consistency
        run: |
          grep -q 'package="com.derka.gd"'      game/AndroidManifest.xml
          grep -q 'android:versionCode="[0-9]\+"'  game/AndroidManifest.xml
          grep -q 'android:value="gd_derka"'    game/AndroidManifest.xml
          grep -q 'android_main'                game/game.c
          ! grep -rq 'com\.cb4\|dimscript'      game/

      - name: Headless level test (host gcc)
        run: |
          gcc -std=c99 -O2 -Wall -DGD_SIM game/gd_core.c -o /tmp/gdsim -lm
          /tmp/gdsim 0        # автопилот обязан пройти уровень
          /tmp/gdsim -0.6     # и с опозданием прыжка на 0.6 блока

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c

      - name: Build native libraries
        env:
          NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          GLUE="$NDK_ROOT/sources/android/native_app_glue"

          for ABI in "arm64-v8a aarch64-linux-android26-clang" \
                     "armeabi-v7a armv7a-linux-androideabi26-clang" \
                     "x86_64 x86_64-linux-android26-clang"; do
            set -- $ABI
            mkdir -p "staging/lib/$1"
            "$TOOLCHAIN/$2" -O3 -std=gnu99 -s -fPIC -shared \
              game/game.c game/gd_core.c "$GLUE/android_native_app_glue.c" \
              -Igame -I"$GLUE" -landroid -llog -lm \
              -o "staging/lib/$1/libgd_derka.so"
          done

      - name: Restore signing key from Secrets
        env:
          P12_BASE64: ${{ secrets.GD_P12_BASE64 || secrets.CB4_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.GD_P12_PASSWORD || secrets.CB4_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$P12_BASE64" || -z "$P12_PASSWORD" ]]; then
            echo "::error::Add GD_P12_BASE64 and GD_P12_PASSWORD (or CB4_*) repository secrets."
            exit 1
          fi
          umask 077
          KEY_DIR="$RUNNER_TEMP/derka-signing"; mkdir -p "$KEY_DIR"; chmod 700 "$KEY_DIR"
          printf '%s' "$P12_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEY_DIR/gd.p12"
          chmod 600 "$KEY_DIR/gd.p12"
          keytool -list -storetype PKCS12 -keystore "$KEY_DIR/gd.p12" \
            -storepass:env P12_PASSWORD > /dev/null

      - name: Package and align APK
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/aapt" package -f \
            -M game/AndroidManifest.xml \
            -S game/res \
            -I "$ANDROID_HOME/platforms/android-35/android.jar" \
            -F unsigned.apk ./staging/
          "$BT/zipalign" -f -p 4 unsigned.apk aligned.apk

      - name: Sign APK
        env:
          P12_PASSWORD: ${{ secrets.GD_P12_PASSWORD || secrets.CB4_P12_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GD_KEY_ALIAS || secrets.CB4_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GD_KEY_PASSWORD || secrets.CB4_KEY_PASSWORD || secrets.GD_P12_PASSWORD || secrets.CB4_P12_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          SIGN=(--ks "$RUNNER_TEMP/derka-signing/gd.p12" --ks-type PKCS12
                --ks-pass env:P12_PASSWORD --key-pass env:KEY_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] && SIGN+=(--ks-key-alias "$KEY_ALIAS")
          "$BT/apksigner" sign "${SIGN[@]}" --out Game.apk aligned.apk

      - name: Verify APK metadata and signature
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/aapt" dump badging Game.apk | head -n 5
          "$BT/aapt" dump badging Game.apk | grep -q "versionCode='[0-9]\+'" \
            || { echo "::error::APK has no versionCode - stores will reject it."; exit 1; }
          "$BT/apksigner" verify --print-certs Game.apk

      - name: Delete temporary signing key
        if: ${{ always() }}
        run: rm -rf -- "${RUNNER_TEMP:?}/derka-signing"

      - uses: actions/upload-artifact@v4
        with:
          name: GeometryDashForDerka-APK-Android8-15
          path: Game.apk
          if-no-files-found: error
